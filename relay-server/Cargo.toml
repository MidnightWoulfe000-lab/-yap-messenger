[package]
name = "yap-relay-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
yap-core = { path = "../core" }
native-tls = "=0.2.18"
tungstenite = { version = "=0.30.0", features = ["native-tls"] }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
