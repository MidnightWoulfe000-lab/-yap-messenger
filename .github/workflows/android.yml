name: Android debug build

on:
  push:
    paths:
      - "android/**"
      - "endpoint/**"
      - "native/**"
      - "core/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "endpoint/**"
      - "native/**"
      - "core/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - name: Build native messaging
        run: bash scripts/build-native.sh
      # GitHub Ubuntu runners already have an Android SDK installed.
      # Avoid a separate setup action until we need custom SDK tooling.
      - name: Build, test and lint Yap
        working-directory: android
        env:
          YAP_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yap-android-checks
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      # The in-app updater reads the build number from this file name.
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "yap-debug-$((1000 + GITHUB_RUN_NUMBER)).apk"
      - name: Save APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: yap-android-debug
          path: yap-debug-*.apk
          if-no-files-found: error
          retention-days: 14

  # Keeps one rolling "debug-latest" release that the app's Check for update button downloads.
  # Runs for main and for manual runs, never for pull requests.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: debug-latest-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yap-android-debug
      - name: Replace the debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create debug-latest yap-debug-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Latest debug build" \
            --notes "Debug build from commit $GITHUB_SHA ($GITHUB_REF_NAME). Development signing key; not a production release."
